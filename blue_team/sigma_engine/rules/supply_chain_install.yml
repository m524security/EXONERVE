title: Malicious Package Install Script
id: b3000006-0000-4000-a000-exonerve999
status: stable
description: >
  Detects a package manager (npm/pip/gem/cargo) spawning a shell or network client — the execution mechanism for dependency-confusion and typosquatting payloads.
author: Exonerve
level: critical
logsource:
  product: exonerve
  service: sentry_agent
detection:
  selection:
    event_type: supply_chain
  condition: selection
falsepositives:
  - Native-module builds invoking compilers (allowlisted in the sensor)
fields:
  - package_manager
  - child_process
  - cmdline
tags:
  - attack.initial_access
  - attack.t1195.002
