title: Credential File Access by Unexpected Process
id: b3000002-0000-4000-a000-exonerve999
status: stable
description: >
  Detects an unexpected process reading cloud or CI credential material (~/.aws/credentials, kubeconfig, docker auth, SSH keys, npm/PyPI tokens).
author: Exonerve
level: critical
logsource:
  product: exonerve
  service: sentry_agent
detection:
  selection:
    event_type: cred_file_access
  condition: selection
falsepositives:
  - Backup and configuration-management tooling reading credential paths
fields:
  - process
  - credential_type
  - path
tags:
  - attack.credential_access
  - attack.t1552.001
