title: "Infostealer: Browser Credential and Cookie Store Access"
id: b3000004-0000-4000-a000-exonerve999
status: stable
description: >
  Detects a non-browser process opening browser password or session-cookie stores. Stolen session cookies enable account takeover that bypasses MFA entirely.
author: Exonerve
level: critical
logsource:
  product: exonerve
  service: sentry_agent
detection:
  selection:
    event_type: browser_cred_theft
  condition: selection
falsepositives:
  - Backup agents and profile-migration tools reading browser profiles
fields:
  - process
  - artifact
  - path
tags:
  - attack.credential_access
  - attack.t1555.003
  - attack.t1539
