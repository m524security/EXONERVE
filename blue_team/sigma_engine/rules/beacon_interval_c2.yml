title: Regular-Interval Low-Volume C2 Beaconing
id: b3000015-0000-4000-a000-exonerve999
status: stable
description: >
  Detects a process making regular, low-jitter connections to the same
  destination over time, independent of transferred volume — the shape of
  C2 beaconing that a pure egress-volume monitor never sees. A timing
  signal only: no payload or volume inspection.
author: Exonerve
level: high
logsource:
  product: exonerve
  service: sentry_agent
detection:
  selection:
    event_type: beacon
  condition: selection
falsepositives:
  - Legitimate periodic-polling software not on the process allowlist
    (custom internal monitoring/sync agents)
fields:
  - destination
  - mean_interval_seconds
  - coefficient_of_variation
  - sample_count
tags:
  - attack.command_and_control
  - attack.t1071
