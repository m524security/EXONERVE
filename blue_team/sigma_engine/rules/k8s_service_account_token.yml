title: Kubernetes Service Account Token Theft
id: b3000003-0000-4000-a000-exonerve999
status: stable
description: >
  Detects an unexpected process reading the mounted service-account token, used to pivot within the cluster via the API server.
author: Exonerve
level: critical
logsource:
  product: exonerve
  service: sentry_agent
detection:
  selection:
    event_type: k8s_token_access
  condition: selection
falsepositives:
  - Sidecars and observability agents that legitimately use the token
fields:
  - process
  - path
tags:
  - attack.credential_access
  - attack.t1552.007
