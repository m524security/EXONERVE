title: Reverse Shell (stdio bound to socket)
id: b3000012-0000-4000-a000-exonerve999
status: stable
description: >
  Detects a shell whose stdin and stdout/stderr are bound to a network socket. This is the structural definition of a reverse shell, so it does not depend on payload strings.
author: Exonerve
level: critical
logsource:
  product: exonerve
  service: sentry_agent
detection:
  selection:
    event_type: reverse_shell
  condition: selection
falsepositives:
  - Some legitimate remote-execution frameworks bind shell stdio to sockets
fields:
  - process
  - pid
  - socket_bound_fds
  - cmdline
tags:
  - attack.execution
  - attack.t1059.004
