title: Sensitive File Access Followed by New Egress (Staged Exfiltration)
id: b3000016-0000-4000-a000-exonerve999
status: stable
description: >
  Detects a process opening sensitive-looking files (credentials, backups,
  customer/financial data) and then connecting to a destination it has not
  talked to before, within a short window — the shape of staged data
  theft, independent of transfer volume. Complements EgressVolumeMonitor,
  which only catches bulk transfers.
author: Exonerve
level: critical
logsource:
  product: exonerve
  service: sentry_agent
detection:
  selection:
    event_type: exfil_graph
  condition: selection
falsepositives:
  - A backup or sync agent reading sensitive-looking paths and uploading to
    its own already-known destination on first run (mitigated by the
    "new destination" requirement in the detector — see
    ExfilGraphDetector._known_destinations)
fields:
  - process
  - destination
  - accessed_paths
tags:
  - attack.exfiltration
  - attack.t1020
